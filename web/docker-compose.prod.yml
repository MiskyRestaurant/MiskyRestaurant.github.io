# Compose de PRODUCCIÓN.
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias frente al docker-compose.yml de desarrollo:
#  - La base de datos NO se expone a internet (sin "ports"): solo es accesible
#    dentro de la red interna de Docker.
#  - La app tampoco publica el puerto 3000 al host: entra el tráfico por Caddy.
#  - Caddy hace de reverse proxy en 80/443 y gestiona el HTTPS automáticamente.
#  - Todos los secretos vienen del archivo .env (ver .env.prod.example).

services:
  db:
    image: postgres:16-alpine
    container_name: misky_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:-misky}
    volumes:
      - misky_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misky} -d ${POSTGRES_DB:-misky}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: misky_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-misky}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-misky}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en el .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@misky.pe}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el .env}
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: misky_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en el .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  misky_pgdata:
  caddy_data:
  caddy_config:
